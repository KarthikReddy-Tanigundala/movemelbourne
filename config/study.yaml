# Study definition. Every threshold used by the pipeline lives here or in dbt seeds.
study:
  # ISO 8601 with offset, Melbourne time. Continuous collection started with the local bridge
  # collector (Windows scheduled task); window_end is set when collection stops.
  window_start: "2026-10-22T00:35:00+11:00"
  window_end: null
  planned_end: "2026-11-19T00:35:00+11:00"   # 28 days; includes Melbourne Cup Day (Tue 3 Nov)
  target_days: 28
  minimum_days: 14
  timezone: Australia/Melbourne
  core_modes: [metro, tram]

static_schedule:
  url: https://opendata.transport.vic.gov.au/dataset/3f4e292e-7f8a-4ffe-831f-1953be0fe448/resource/fb152201-859f-4882-9206-b768060b50ad/download/gtfs.zip
  # Outer-zip folder -> mode. Folder layout verified on the 2026-10-16 release (docs/probe_results.md).
  mode_branches:
    "2": metro
    "3": tram
  stretch_mode_branches:
    "1": vline
    "4": bus

inference:
  # A last-captured prediction is accepted as the observed arrival only if the snapshot that
  # carried it was taken within this many seconds of the predicted time (METHODOLOGY.md §2).
  freshness_window_s: 120
  # Gap between consecutive snapshots above which events in between are a collection gap.
  max_poll_gap_s: 180
  # Primary observed-arrival method per mode: last_prediction | vehicle_position (ADR-004).
  primary_method:
    metro: last_prediction
    tram: last_prediction
  # Vehicle-position fallback: first fresh position within this distance of one of the trip's
  # scheduled stops. DTP's VP feeds carry no stop_id/status/speed (probe 2026-10-21), so speed
  # is only applied if present. Positions older than vp_max_age_s at poll time are dropped.
  vp_proximity_m: 30
  vp_max_speed_mps: 1.0
  vp_max_age_s: 180

quality:
  min_match_rate: 0.95
  delay_min_s: -1800
  delay_max_s: 7200
  min_sample_events: 30
  coverage_gap_alert_hours: 2
  min_poll_success_rate: 0.90

analysis:
  bootstrap_resamples: 2000
  bootstrap_seed: 42
  bunching_ratio: 0.5
