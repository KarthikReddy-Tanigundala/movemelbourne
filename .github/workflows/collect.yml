name: collect-realtime
# GitHub's scheduled triggers are heavily throttled (the */30 cron fired every 4-7 h), so each run
# queues its own successor at the start: the next run waits in the concurrency group and begins as
# soon as this one ends. The cron stays as a backup restart if the chain ever breaks. To stop the
# chain, set the repository variable COLLECT_CHAIN to "off" (Settings > Variables > Actions).
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
concurrency:
  group: collect-realtime
  cancel-in-progress: false      # never overlap two collectors
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - name: Queue the next run (self-chain)
        if: vars.COLLECT_CHAIN != 'off'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run collect.yml --repo "$GITHUB_REPOSITORY" --ref "${{ github.ref_name }}" || echo "::warning::could not queue next run"
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --no-default-groups
      - run: uv run python -m movemelbourne.collect.run_collection --max-runtime-min 29 --out-dir runs --no-lake
        env:
          TVOD_API_KEY: ${{ secrets.TVOD_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: Karry001/movemelbourne-gtfsr
      - name: Keep run output if the HF upload failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/
          retention-days: 7
