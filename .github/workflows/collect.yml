name: collect-realtime
on:
  schedule:
    - cron: "*/30 * * * *"      # UTC; runs may start late, the 27-min loop absorbs this
  workflow_dispatch:
concurrency:
  group: collect-realtime
  cancel-in-progress: false      # never overlap two collectors
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen --no-default-groups
      - run: uv run python -m movemelbourne.collect.run_collection --max-runtime-min 27 --out-dir runs
        env:
          TVOD_API_KEY: ${{ secrets.TVOD_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET_REPO: Karry001/movemelbourne-gtfsr
      - name: Keep run output if the HF upload failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: run-${{ github.run_id }}-${{ github.run_attempt }}
          path: runs/
          retention-days: 7
