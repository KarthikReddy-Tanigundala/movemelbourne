[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "movemelbourne"
version = "0.1.0"
description = "Melbourne train and tram reliability analytics from self-collected GTFS-Realtime data"
authors = [{ name = "Karthik Reddy Tanigundala" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Core dependencies = exactly what the collector needs. The GitHub Actions collector installs
# only these (`uv sync --frozen --no-default-groups`), so every run starts in seconds.
dependencies = [
    "gtfs-realtime-bindings>=1.0",
    "protobuf>=4.25",
    "requests>=2.32",
    "tenacity>=9.0",
    "huggingface_hub>=0.26",
    "pyarrow>=17",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "tzdata>=2024.1",  # zoneinfo has no system tz database on Windows
]

[dependency-groups]
# Warehouse, static GTFS, analysis and dashboard (local dev + CI).
analysis = [
    "duckdb>=1.1",
    "dbt-core>=1.8",
    "dbt-duckdb>=1.8",
    "pandas>=2.2",
    "numpy>=1.26",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyogrio>=0.9",
    "holidays>=0.58",
    "matplotlib>=3.9",
    "tabulate>=0.9",  # DataFrame.to_markdown in reports
]
app = [
    "streamlit>=1.39",
    "plotly>=5.24",
    "pydeck>=0.9",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "pre-commit>=4.0",
    "detect-secrets>=1.5",
]

[tool.uv]
default-groups = ["analysis", "app", "dev"]

[tool.hatch.build.targets.wheel]
packages = ["src/movemelbourne"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "app", "scripts", "tests"]
extend-exclude = ["dbt"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
